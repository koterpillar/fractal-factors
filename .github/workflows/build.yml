name: CI
on:
  push:
    branches:
      - "main"
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install dependencies
        run: ./bin/install-dev
      - name: Lint
        run: ./bin/lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install dependencies
        run: ./bin/install-dev --no-lint
      - id: test
        name: Test
        uses: freckle/stack-action@v5
        with:
          cache-prefix: test
          stack-build-arguments: --fast --lock-file error-on-write --coverage
      - name: Rename coverage
        run: cp ${{ steps.test.outputs.local-hpc-root }}/mybox/tests/tests.tix coverage.tix
      - name: Upload coverage
        uses: actions/upload-artifact@v6
        with:
          name: coverage-0
          path: '*.tix'

  coverage:
    name: Coverage
    needs:
      - test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install dependencies
        run: ./bin/install-dev --no-lint
      - id: compile
        name: Compile
        uses: freckle/stack-action@v5
        with:
          # Run the suite to generate coverage skeleton, but no tests
          stack-build-arguments: --fast --lock-file error-on-write --coverage --ta "--match XXXXX"
          cache-prefix: coverage
      - name: Download
        uses: actions/download-artifact@v7
        with:
          pattern: 'coverage-*'
          merge-multiple: true
      - name: Move coverage
        run: mv coverage.tix > ${{ steps.compile.outputs.local-hpc-root }}/combined/all/all.tix
      - name: Convert
        uses: 8c6794b6/hpc-codecov-action@v4
        with:
          target: stack:all
      - name: Upload
        uses: codecov/codecov-action@v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
